<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TM3 - Data Model Checklist</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#e8e8e8;color:#1e293b;padding:20px}
  h1.mt{text-align:center;font-size:20pt;color:#1e3a8a;margin-bottom:6px}
  p.st{text-align:center;color:#64748b;margin-bottom:24px;font-size:9pt}
  .pbar{max-width:900px;margin:0 auto 24px;background:#fff;border-radius:10px;padding:12px 20px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .pbar .lb{font-size:9pt;color:#64748b;margin-bottom:5px;display:flex;justify-content:space-between}
  .sync-bar{max-width:900px;margin:0 auto 16px;display:flex;gap:8px;justify-content:flex-end}
  .sync-btn{padding:5px 14px;border-radius:6px;font-size:8pt;font-weight:600;cursor:pointer;border:1px solid #ccc;background:#fff;color:#555;transition:all .15s}
  .sync-btn:hover{background:#f0f0f0;border-color:#999}
  .sync-btn.imp{background:#2563eb;color:#fff;border-color:#2563eb}
  .sync-btn.imp:hover{background:#1d4ed8}
  .sync-btn.rst{color:#ef4444;border-color:#ef4444}
  .sync-btn.rst:hover{background:#fef2f2}
  .sync-status{font-size:8pt;color:#888;display:flex;align-items:center;gap:4px;margin-right:auto}
  .sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .sync-dot.on{background:#22c55e}
  .sync-dot.off{background:#ccc}
  .ptr{width:100%;height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}
  .pfl{height:100%;background:linear-gradient(90deg,#3b82f6,#2563eb);border-radius:4px;transition:width .3s}
  .sec-title{max-width:900px;margin:0 auto 12px;font-size:13pt;color:#1e3a8a;padding-left:4px;border-left:4px solid #2563eb;padding:4px 10px}
  .mlist{max-width:900px;margin:0 auto 32px;display:flex;flex-direction:column;gap:20px}
  .mtbl-wrap{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.1);overflow:hidden;position:relative}
  .mtbl{width:100%;border-collapse:collapse;font-size:9pt}
  .mtbl th.mh{font-size:11pt;font-weight:700;padding:8px 16px;text-align:left;letter-spacing:.5px;text-transform:uppercase;border-bottom:1.5px solid rgba(0,0,0,.15)}
  .mtbl th.mc{font-size:8.5pt;font-weight:600;padding:6px 14px;text-align:left;border-bottom:1px solid rgba(0,0,0,.12)}
  .mtbl td{padding:5px 14px;border-bottom:1px solid rgba(0,0,0,.06);font-size:8.5pt;vertical-align:middle;transition:background .15s}
  .mtbl td:first-child{width:30px}
  .mtbl td:nth-child(2){font-family:'Consolas','Monaco',monospace;font-weight:700;font-size:8.5pt;white-space:nowrap;width:60px}
  .mtbl td:last-child{width:24px;text-align:right}
  .mtbl tr:last-child td{border-bottom:none}
  .mtbl select{font-size:8pt;padding:2px 4px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;max-width:140px}
  .mtbl select:focus{border-color:#2563eb;outline:none}
  .mtbl td input[type="checkbox"]{width:14px;height:14px;cursor:pointer;accent-color:#555}
  .mtbl .col-del{opacity:0;cursor:pointer;background:none;border:none;color:inherit;font-size:9pt;padding:0 2px;margin-left:4px;transition:opacity .15s;font-weight:700;vertical-align:middle}
  .mtbl th:hover .col-del{opacity:.6}
  .mtbl .col-del:hover{opacity:1}
  .mtbl .del-btn{opacity:0;cursor:pointer;background:none;border:none;color:#ef4444;font-size:11pt;padding:0 2px;transition:opacity .15s;font-weight:700}
  .mtbl tr:hover .del-btn{opacity:.7}
  .mtbl .del-btn:hover{opacity:1}
  .mtbl-wrap .add-row{border-top:1px solid rgba(0,0,0,.06)}
  .mtbl-wrap .card-del{position:absolute;top:6px;right:10px}
  .mlist .new-tbl-btn{min-height:50px;align-self:center;width:220px}
  .grid{max-width:900px;margin:0 auto 32px;display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:start}
  .card{display:inline-block;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12);border:1.5px solid #ccc;background:#fff;flex-shrink:0;position:relative}
  .etbl{border-collapse:collapse;font-size:8.5pt}
  .etbl th.eh{font-size:10pt;font-weight:700;padding:7px 16px;text-align:center;letter-spacing:.5px;text-transform:uppercase;border-bottom:1.5px solid rgba(0,0,0,.15)}
  .etbl th.ch{font-size:8pt;font-weight:600;padding:5px 10px;text-align:left;border-bottom:1px solid rgba(0,0,0,.12)}
  .etbl td{padding:4px 10px;border-bottom:1px solid rgba(0,0,0,.06);font-size:8pt;vertical-align:middle;transition:background .15s}
  .etbl td:nth-child(2){font-family:'Consolas','Monaco',monospace;font-weight:600;font-size:7.5pt;white-space:nowrap}
  .etbl td:nth-child(3){max-width:200px}
  .etbl td:last-child{font-size:7.5pt;text-align:right}
  .etbl tr:last-child td{border-bottom:none}
  .etbl td input[type="checkbox"]{width:13px;height:13px;cursor:pointer;accent-color:#555}
  .etbl .drag-h{cursor:grab;opacity:0;font-size:9pt;color:#999;user-select:none;transition:opacity .15s;padding:0 2px}
  .etbl tr:hover .drag-h{opacity:.5}
  .etbl .drag-h:hover{opacity:1}
  .etbl tr.drag-over{border-top:2px solid #42A5F5}
  .etbl tr.dragging{opacity:.3}
  .etbl .del-btn{opacity:0;cursor:pointer;background:none;border:none;color:#ef4444;font-size:11pt;padding:0 2px;transition:opacity .15s;font-weight:700}
  .etbl tr:hover .del-btn{opacity:.7}
  .etbl .del-btn:hover{opacity:1}
  .add-row{display:flex;justify-content:center;padding:4px;border-top:1px solid rgba(0,0,0,.06)}
  .add-row button{background:none;border:1px dashed #aaa;border-radius:6px;padding:2px 14px;font-size:7.5pt;color:#888;cursor:pointer;transition:all .15s}
  .add-row button:hover{border-color:#555;color:#555;background:rgba(0,0,0,.03)}
  .card-del{position:absolute;top:4px;right:8px;background:none;border:none;font-size:13pt;cursor:pointer;opacity:0;transition:opacity .15s;color:#c00;font-weight:700;z-index:2}
  .card:hover .card-del{opacity:.6}
  .card-del:hover{opacity:1!important}
  [contenteditable]{outline:none;border-radius:2px;padding:0 2px;transition:background-color .15s}
  [contenteditable]:hover{background:rgba(59,130,246,.08)}
  [contenteditable]:focus{background:rgba(59,130,246,.12);box-shadow:0 0 0 1.5px rgba(59,130,246,.25)}
  .new-tbl-btn{background:#fff;border:2px dashed #bbb;border-radius:10px;min-width:180px;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;gap:6px;padding:20px}
  .new-tbl-btn:hover{border-color:#666;background:#fafafa}
  .new-tbl-btn span{font-size:24pt;color:#aaa;line-height:1}
  .new-tbl-btn small{font-size:8pt;color:#999}
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
  .modal-bg.open{display:flex}
  .modal{background:#fff;border-radius:12px;padding:24px;min-width:300px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
  .modal h3{font-size:12pt;margin-bottom:16px;color:#333}
  .modal label{font-size:9pt;color:#555;display:block;margin-bottom:4px;margin-top:12px}
  .modal input[type="text"]{width:100%;padding:6px 10px;border:1px solid #ccc;border-radius:6px;font-size:9pt}
  .color-opts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
  .color-opt{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .15s}
  .color-opt:hover,.color-opt.sel{border-color:#333}
  .modal-btns{margin-top:20px;display:flex;gap:8px;justify-content:flex-end}
  .modal-btns button{padding:6px 16px;border-radius:6px;font-size:9pt;cursor:pointer;font-weight:600}
  .btn-cancel{background:#eee;border:1px solid #ccc;color:#555}
  .btn-ok{background:#2563eb;border:none;color:#fff}
  .btn-ok:hover{background:#1d4ed8}
</style>
</head>

<h1 class="mt">TM3 Data Model Checklist</h1>
<p class="st">Plataforma de Alerta Temprana - Universidad Autonoma de Chile</p>

<div class="pbar">
  <div class="lb"><span>Progreso General</span><span id="ptxt">0/0 (0%)</span></div>

<div class="mlist" id="mgrid"></div>

<h2 class="sec-title" id="sec-ent">Modelo de Datos</h2>
<div class="grid" id="grid"></div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="m-title">Nueva Tabla</h3>
    <label>Nombre</label>
    <input type="text" id="m-name" placeholder="NOMBRE">
    <label>Color</label>
    <div class="color-opts" id="m-colors"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-ok" onclick="createNew()">Crear</button>
    </div>
  </div>
</div>

function headHas(heads,key){var k=key.toLowerCase(),ks=k.replace(/s$/,'');return heads.some(function(h){var l=h.toLowerCase();return l===k||l===ks||l+'s'===k})}

// ========== STATE ==========
function initMetrics(){return defaultMetrics.map(function(m){return{id:m.id,name:m.name,color:m.color,heads:m.heads.slice(),items:m.items.map(function(it){return{v:it.slice(),ck:false,calculo:"",fuente:"",ubicacion:"",vistas:""}})}})}
function initEntities(){return defaultEntities.map(function(e){return{id:e.id,name:e.name,color:e.color,attrs:e.attrs.map(function(a){return{n:a[0],d:a[1],t:a[2],ck:false}})}})}

var state=JSON.parse(localStorage.getItem('tm3_state')||'null');
if(!state){state={metrics:initMetrics(),entities:initEntities()}}
else if(!state.metrics){state.metrics=initMetrics()}
// Migrate: add standard fields to existing metric items
if(state.metrics){state.metrics.forEach(function(cat){cat.items.forEach(function(it){if(it.fuente===undefined)it.fuente=it.src||"";if(it.ubicacion===undefined)it.ubicacion=it.tbl||"";if(it.calculo===undefined)it.calculo="";if(it.vistas===undefined)it.vistas="";delete it.src;delete it.tbl})})}
// Migrate Riesgo: remove Calculo and Ubicacion from heads if still present
if(state.metrics){state.metrics.forEach(function(cat){if(cat.id==='m-riesgo'){var rm=[];cat.heads.forEach(function(h,i){var l=h.toLowerCase();if(l==='calculo'||l==='ubicacion')rm.push(i)});if(rm.length){for(var i=rm.length-1;i>=0;i--){cat.heads.splice(rm[i],1);cat.items.forEach(function(it){if(it.v.length>rm[i])it.v.splice(rm[i],1)})}}}})}
function migrateEntities(){
  var defMap={};defaultEntities.forEach(function(e){defMap[e.id]=e});
  var stateIds={};state.entities.forEach(function(e){stateIds[e.id]=true});
  var changed=false;
  state.entities.forEach(function(ent){
    var def=defMap[ent.id];if(!def)return;
    var has={};ent.attrs.forEach(function(a){has[a.n]=true});
    def.attrs.forEach(function(da){if(!has[da[0]]){ent.attrs.push({n:da[0],d:da[1],t:da[2],ck:false});changed=true}});
  });
  defaultEntities.forEach(function(def){
    if(!stateIds[def.id]){state.entities.push({id:def.id,name:def.name,color:def.color,attrs:def.attrs.map(function(a){return{n:a[0],d:a[1],t:a[2],ck:false}})});changed=true}
  });
  var order=defaultEntities.map(function(e){return e.id});
  var entMap={};state.entities.forEach(function(e){entMap[e.id]=e});
  var sorted=[];order.forEach(function(id){if(entMap[id])sorted.push(entMap[id])});
  state.entities.forEach(function(e){if(order.indexOf(e.id)===-1)sorted.push(e)});
  if(JSON.stringify(sorted.map(function(e){return e.id}))!==JSON.stringify(state.entities.map(function(e){return e.id}))){changed=true}
  state.entities=sorted;
  return changed;
}
if(!firebaseReady&&migrateEntities()){localStorage.setItem('tm3_state',JSON.stringify(state))}

function save(){
  localStorage.setItem('tm3_state',JSON.stringify(state));
  if(firebaseReady&&!remoteUpdate){db.set(state)}
}

}

// ========== HELPERS ==========
function tc(hex){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return(.299*r+.587*g+.114*b)/255>.6?'#333':'#fff'}
function rga(hex,a){return'rgba('+parseInt(hex.slice(1,3),16)+','+parseInt(hex.slice(3,5),16)+','+parseInt(hex.slice(5,7),16)+','+a+')'}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function uid(){return 'x'+Date.now()+Math.random().toString(36).slice(2,7)}

      h+='<tr style="background:'+bg+'" data-sec="e" data-gi="'+ei+'" data-ai="'+ai+'">';
      h+='<td><span class="drag-h">&#10303;</span></td>';
      h+='<td><input type="checkbox"'+(a.ck?' checked':'')+' data-sec="e" data-gi="'+ei+'" data-ai="'+ai+'"/></td>';
      h+='<td style="'+fkStyle+'"><span contenteditable="true" data-sec="e" data-gi="'+ei+'" data-ai="'+ai+'" data-f="n">'+esc(a.n)+'</span></td>';
      h+='<td style="'+fkStyle+'"><span contenteditable="true" data-sec="e" data-gi="'+ei+'" data-ai="'+ai+'" data-f="d">'+esc(a.d)+'</span></td>';
      h+='<td style="'+fkStyle+'"><span contenteditable="true" data-sec="e" data-gi="'+ei+'" data-ai="'+ai+'" data-f="t">'+esc(a.t)+'</span></td>';
      h+='<td><button class="del-btn" data-sec="e" data-gi="'+ei+'" data-ai="'+ai+'" title="Eliminar">&times;</button></td>';
      h+='</tr>';
    });
    h+='</table>';
    h+='<div class="add-row"><button data-sec="e" data-gi="'+ei+'">+ atributo</button></div>';
    var card=document.createElement('div');card.className='card';card.id='c-'+ent.id;
    card.style.borderColor=rga(col,.4);card.innerHTML=h;
    grid.appendChild(card);
  });
  var nb=document.createElement('div');nb.className='new-tbl-btn';nb.id='new-btn';
  nb.innerHTML='<span>+</span><small>Nueva tabla</small>';
  nb.onclick=function(){openModal('e')};
  grid.appendChild(nb);

  updateProgress();
}

function updateProgress(){
  var t=0,c=0;
  state.metrics.forEach(function(m){m.items.forEach(function(it){t++;if(it.ck)c++})});
  state.entities.forEach(function(e){e.attrs.forEach(function(a){t++;if(a.ck)c++})});
  var p=t>0?Math.round(c/t*100):0;
  document.getElementById('ptxt').textContent=c+'/'+t+' ('+p+'%)';
  document.getElementById('pfill').style.width=p+'%';
}

// ========== EVENTS ==========
document.addEventListener('change',function(e){
  var sec=e.target.dataset.sec,gi=e.target.dataset.gi!==undefined?+e.target.dataset.gi:null;
  // Dropdown selects (Origen / Tabla)
  if(e.target.tagName==='SELECT'&&sec==='m'&&e.target.dataset.ri!==undefined){
    var ri=+e.target.dataset.ri,f=e.target.dataset.f;
    state.metrics[gi].items[ri][f]=e.target.value;
    save();return;
  }
  // Checkboxes
  if(e.target.type!=='checkbox')return;
  if(sec==='m'&&e.target.dataset.ri!==undefined){
    var ri=+e.target.dataset.ri;
    state.metrics[gi].items[ri].ck=e.target.checked;save();
    var tr=e.target.closest('tr'),col=state.metrics[gi].color;
    tr.style.background=e.target.checked?rga(col,.18):(ri%2===0?'#fff':rga(col,.05));
    updateProgress();
  }
  if(sec==='e'&&e.target.dataset.ai!==undefined){
    var ai=+e.target.dataset.ai;
    state.entities[gi].attrs[ai].ck=e.target.checked;save();
    var tr=e.target.closest('tr'),col=state.entities[gi].color;
    tr.style.background=e.target.checked?rga(col,.22):rga(col,.10);
    updateProgress();
  }
});

document.addEventListener('click',function(e){
  var sec,gi,btn;
  // Delete row
  if(e.target.classList.contains('del-btn')){
    sec=e.target.dataset.sec;gi=+e.target.dataset.gi;
    if(sec==='m'){state.metrics[gi].items.splice(+e.target.dataset.ri,1)}
    if(sec==='e'){state.entities[gi].attrs.splice(+e.target.dataset.ai,1)}
    save();render();return;
  }
  // Delete column
  if(e.target.classList.contains('col-del')){
    sec=e.target.dataset.sec;gi=+e.target.dataset.gi;var hi=+e.target.dataset.hi;
    if(sec==='m'){state.metrics[gi].heads.splice(hi,1);state.metrics[gi].items.forEach(function(it){if(it.v.length>hi)it.v.splice(hi,1)})}
    save();render();return;
  }
  // Delete card
  if(e.target.classList.contains('card-del')){
    sec=e.target.dataset.sec;gi=+e.target.dataset.gi;
    if(sec==='m'&&state.metrics.length>1){state.metrics.splice(gi,1)}
    if(sec==='e'&&state.entities.length>1){state.entities.splice(gi,1)}
    save();render();return;
  }
  // Add row
  btn=e.target.closest('.add-row button');
  if(btn){
    sec=btn.dataset.sec;gi=+btn.dataset.gi;
    if(sec==='m'){
      var empty=state.metrics[gi].heads.map(function(){return'-'});
      state.metrics[gi].items.push({v:empty,ck:false,calculo:"",fuente:"",ubicacion:"",vistas:""});
    }
    if(sec==='e'){
      state.entities[gi].attrs.push({n:'nuevo_attr',d:'Descripcion',t:'STRING',ck:false});
    }
    save();render();return;
  }
});

document.addEventListener('blur',function(e){
  if(!e.target.hasAttribute||!e.target.hasAttribute('contenteditable'))return;
  var f=e.target.dataset.f,sec=e.target.dataset.sec,gi=e.target.dataset.gi;
  if(!sec||gi===undefined)return;
  var txt=e.target.textContent.trim();if(!txt)return;
  gi=+gi;
  if(sec==='m'){
    if(f==='name'){state.metrics[gi].name=txt}
    else if(f==='head'&&e.target.dataset.hi!==undefined){state.metrics[gi].heads[+e.target.dataset.hi]=txt}
    else if(e.target.dataset.ri!==undefined&&e.target.dataset.ci!==undefined){state.metrics[gi].items[+e.target.dataset.ri].v[+e.target.dataset.ci]=txt}
    else if(e.target.dataset.ri!==undefined&&f){state.metrics[gi].items[+e.target.dataset.ri][f]=txt}
  }
  if(sec==='e'){
    var ai=e.target.dataset.ai;
    if(f==='name'){state.entities[gi].name=txt}
    else if(ai!==undefined&&f){state.entities[gi].attrs[+ai][f]=txt}
  }
  save();
},true);

document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.hasAttribute&&e.target.hasAttribute('contenteditable')){e.preventDefault();e.target.blur()}
});

// ========== MODAL ==========
var selColor=ALL_COLORS[0].hex,modalFor='e';
function openModal(target){
  modalFor=target;
  document.getElementById('m-title').textContent=target==='m'?'Nueva Categoria de Metricas':'Nueva Tabla';
  document.getElementById('modal').classList.add('open');
  document.getElementById('m-name').value='';
  var mc=document.getElementById('m-colors');mc.innerHTML='';
  ALL_COLORS.forEach(function(c){
    var d=document.createElement('div');d.className='color-opt'+(c.hex===selColor?' sel':'');
    d.style.background=c.hex;
    d.onclick=function(){selColor=c.hex;mc.querySelectorAll('.color-opt').forEach(function(o){o.classList.remove('sel')});d.classList.add('sel')};
    mc.appendChild(d);
  });
  document.getElementById('m-name').focus();
}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function createNew(){
  var name=document.getElementById('m-name').value.trim().toUpperCase();
  if(!name){document.getElementById('m-name').focus();return}
  if(modalFor==='m'){
    state.metrics.push({id:uid(),name:name,color:selColor,heads:["ID","Nombre","Rango","Calculo","Vistas"],items:[{v:["-","-","-","-","-"],ck:false,calculo:"",fuente:"",ubicacion:"",vistas:""}]});
  }else{
    state.entities.push({id:uid(),name:name,color:selColor,attrs:[{n:'id',d:'Identificador unico',t:'UUID',ck:false}]});
  }
  save();render();closeModal();
}
document.getElementById('m-name').addEventListener('keydown',function(e){if(e.key==='Enter')createNew()});

// ========== DRAG & DROP ATTRIBUTES ==========
var dragSrcGi=null,dragSrcAi=null;
document.addEventListener('mousedown',function(e){
  if(!e.target.classList.contains('drag-h'))return;
  var tr=e.target.closest('tr[data-ai]');if(tr)tr.draggable=true;
});
document.addEventListener('mouseup',function(){
  document.querySelectorAll('tr[draggable]').forEach(function(el){el.draggable=false});
});
document.addEventListener('dragstart',function(e){
  var tr=e.target.closest&&e.target.closest('tr[data-ai]');
  if(!tr||tr.dataset.sec!=='e')return;
  dragSrcGi=+tr.dataset.gi;dragSrcAi=+tr.dataset.ai;
  tr.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',dragSrcAi);
});
document.addEventListener('dragover',function(e){
  var tr=e.target.closest&&e.target.closest('tr[data-ai]');
  if(!tr||tr.dataset.sec!=='e'||+tr.dataset.gi!==dragSrcGi)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.drag-over').forEach(function(el){el.classList.remove('drag-over')});
  tr.classList.add('drag-over');
});
document.addEventListener('dragleave',function(e){
  var tr=e.target.closest&&e.target.closest('tr[data-ai]');
  if(tr)tr.classList.remove('drag-over');
});
document.addEventListener('drop',function(e){
  var tr=e.target.closest&&e.target.closest('tr[data-ai]');
  if(!tr||tr.dataset.sec!=='e'||+tr.dataset.gi!==dragSrcGi)return;
  e.preventDefault();
  var toAi=+tr.dataset.ai;
  if(dragSrcAi===toAi)return;
  var attrs=state.entities[dragSrcGi].attrs;
  var moved=attrs.splice(dragSrcAi,1)[0];
  attrs.splice(toAi,0,moved);
  save();render();
});
document.addEventListener('dragend',function(){
  dragSrcGi=null;dragSrcAi=null;
  document.querySelectorAll('.dragging,.drag-over').forEach(function(el){el.classList.remove('dragging','drag-over')});
});

// ========== EXPORT / IMPORT ==========
function exportState(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='tm3_state_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(a.href);
}
function importState(input){
  var f=input.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d.metrics||!d.entities){alert('JSON invalido: debe tener metrics y entities');return}
      state=d;save();render();alert('Estado importado correctamente');
    }catch(e){alert('Error al leer JSON: '+e.message)}
  };
  r.readAsText(f);input.value='';
}
function resetState(){
  if(!confirm('Esto borra todos los cambios y vuelve a los valores por defecto. Continuar?'))return;
  state={metrics:initMetrics(),entities:initEntities()};
  save();render();
}

render();
</script>
